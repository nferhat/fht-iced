[package]
name = "fht-iced"
version = "0.1.0"
description = "Custom Iced theme for fht projects"
authors = ["Nadjib Ferhat <nferhat20@gmail.com>"]
license = "GPL-3.0"
edition = "2021"
repository = "https://github.com/nferhat/fht-compositor"

[dependencies]
# Instead of relying on cargo to figure out dependencies, each project
# that develop ships iced (pop-os' fork) as submodule, avoiding too much madness
iced = { path = "./iced" }
iced_runtime = { path = "./iced/runtime" }

[lib]
path = "src/lib.rs"
